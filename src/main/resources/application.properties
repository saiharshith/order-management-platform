spring.application.name=order-management-platform

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:orders}
spring.datasource.username=${POSTGRES_USER:orders_user}
spring.datasource.password=${POSTGRES_PASSWORD:orders_pass}

# ddl-auto=update is convenient for learning/dev - it auto-syncs the schema from entities.
# Never use it in production; use a migration tool like Flyway or Liquibase instead.
spring.jpa.hibernate.ddl-auto=update

# Dev-only fallback; override with a real secret via the JWT_SECRET env var in production.
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-change-me-to-something-random-and-long}

# Dev-only fallbacks; override via the ADMIN_USERNAME/ADMIN_PASSWORD env vars in production.
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Defaults to the EXTERNAL listener port (9094) for local dev outside Compose;
# inside Compose, KAFKA_BOOTSTRAP_SERVERS overrides this to kafka:9092 (the PLAINTEXT listener).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
kafka.topics.order-placed=order.placed
outbox.publisher.poll-interval-ms=2000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.info.env.enabled=true

info.app.name=Order Management Platform
info.app.description=REST API for managing orders, backed by Postgres and Redis

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{correlationId}] [%15.15t] %-40.40logger{39} : %m%n
